# Fixture record for round-problems (see fixtures/README.md).

id = "knitting/sections/round-problems"
title = "Working in the round: every refusal"
technique = "joining into the round, working part of the round flat, rows, shaping, picking up, needle groups, closing, gap short rows (all as refusals)"
files = ["round-problems.plyknit", "round-problems.expect.json"]
created = "2026-11-15"
license = "original"
provenance = """
Written for Ply's tests: the document was typed by hand and saved through the engine's own .plyknit writer (schema version 5). A list of deliberate mistakes around a few steps that work, not a pattern anyone would knit; no published material was used. Each ledger count and each problem's place was worked out by hand from the steps before it (a refused step changes nothing), before the engine was run on the file, and then compared with it. On 2026-11-15 (review fix: the sides of a part worked flat now move with its stitches) the heel section from step 7 and the last section were worked out by hand again: a second pick-up at the right side is now accepted with a warning, the not-at-a-side refusal moved to Heel, step 10 and Back in the round, step 2, Heel, step 14 asks for 10 stitches before the gap (9 are there) so it still checks that refusal, and two refusals were added at the end (moving the start of the round while working flat, a German turn after a decrease)."""

[sources]
# Conventions the oracle's written text and ledger follow (cited, nothing reproduced).
references = [
  "No technique source: the conventions are those of the two sock fixtures beside it.",
]

[verification]
automated_checks = "pass"
automated_detail = """
rust/ply-knit/tests/section_fixtures.rs (section_fixtures_match_their_oracles): the file parses as \
a current .plyknit envelope and re-saves to the same bytes; the written instructions equal the \
oracle line for line; every ledger line has the oracle's text, place and count (on the needle, still \
to work, waiting past a turn, wraps and double stitches pending, each group on hold, bound off, side, \
in the round, each needle group, worked flat, grafted); validation reports exactly the oracle's \
issues. app/test/knit_sections_fixture_test.dart reads the same files (the current schema version, \
the sections' shape, and the PDF and screen text built from the oracle)."""
practitioner_knit_check = "pending"
practitioner_reviewer = "owner"
known_limits = "One error per refused step, by design. Moving the start of the round in flat work or where it already is, closing at a short-row turn, and refusals that need a pattern worked in the round from its cast-on (a chart round in flat work, a chart round started partway through a round) or more stitches than a fixture should hold (a pick-up or shaping past the stitch cap) are unit tests in rust/ply-knit/tests/sections_round.rs."
