provenance = """
2x2 rib with one edge stitch at each side, charted as 6 cells: the edges and one copy of the 4-stitch motif, worked 3 times. Wrong-side rows reuse the right-side cells and are read left to right as their wrong-side stitches, so the knit columns stay knit on the right side. Written for Ply's tests through the engine's own .plyknit writer; no published \
chart or text was copied."""

