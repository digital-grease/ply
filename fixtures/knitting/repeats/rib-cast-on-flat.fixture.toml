# Fixture record for rib-cast-on-flat (see fixtures/README.md).

id = "knitting/repeats/rib-cast-on-flat"
title = "2x2 rib repeated to the end from a stated cast-on"
technique = "ribbing"
files = ["rib-cast-on-flat.plyknit", "rib-cast-on-flat.expect.json"]
created = "2026-11-12"
license = "original"
provenance = """
The rib-cast-on-unknown-flat chart with a cast-on of 26 stitches (.plyknit schema version 3). The \
cast-on is what row 1 works over, so the first row's to-end repeat is counted (6 times) instead of \
warned about, and the written instructions open with the cast-on. Written for Ply's tests through \
the engine's own .plyknit writer; no published chart or text was copied."""

[sources]
# Conventions the oracle's written text follows (cited, nothing reproduced).
