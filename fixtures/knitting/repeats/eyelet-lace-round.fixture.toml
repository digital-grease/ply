# Fixture record for eyelet-lace-round (see fixtures/README.md).

id = "knitting/repeats/eyelet-lace-round"
title = "Eyelet lace in the round over a 6-stitch motif"
technique = "lace"
files = ["eyelet-lace-round.plyknit", "eyelet-lace-round.expect.json"]
created = "2026-11-12"
license = "original"
provenance = """
An original eyelet motif (k, yo, ssk, k, k2tog, yo) worked in the round, an increase round (yo, k3, yo, k) that grows 24 stitches to 36, and a final round that drops one decrease from the eyelet motif so the round no longer matches the stitches on the needle. Written for Ply's tests through the engine's own .plyknit writer; no published \
chart or text was copied."""

