rust/ply-nalbind/tests/recipe_fixtures.rs: every segment report and the one Info equal the oracle. \
app/test/nalbind_recipe_model_test.dart decodes and re-encodes it byte for byte, ticks included; \
app/test/nalbind_recipe_fixture_test.dart prints it and follows it from the oracle."""
practitioner_nalbind_check = "pending"
practitioner_reviewer = "owner"
known_limits = "A hat is sized by trying it on; the recipe records the head measurement and the crown target but Ply does not turn them into stitch counts."
