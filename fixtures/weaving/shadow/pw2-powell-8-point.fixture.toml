recorded parameters (line endings aside); every structural test passes across the repeat join (strict color \
alternation, shafts paired by every lift, every end and pick beside its partner, no float longer \
than two, plain-weave block regions, lines that survive color normalization); its Atwater form \
weaves identical cloth."""
practitioner_weave_check = "pending"
practitioner_reviewer = "owner"
known_limits = "Structure and color order only. Sett, yarns and finishing are not part of the fixture."
