# Fixture record for double-width-folded (see fixtures/README.md).

id = "weaving/looms/double-width-folded"
title = "Plain-weave double width, 480 ends at 24 ends per inch, checked at its folded width"
technique = "loom feasibility, double width"
files = ["double-width-folded.wif", "double-width-folded.expect.json", "looms.json"]
created = "2026-11-15"
license = "original"
